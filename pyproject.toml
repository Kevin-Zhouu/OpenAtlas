[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "openatlas"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3", "PyYAML>=6,<7", "docker>=7,<8", "playwright>=1.50,<2", "httpx>=0.28,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[tool.setuptools.packages.find]
include = ["openatlas*"]
[tool.setuptools.package-data]
openatlas = ["migrations/*.sql", "resources/*.md", "resources/goldens/*.json", "resources/goldens/*/*.md", "resources/goldens/*/*.json", "resources/goldens/*/*.jpg"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
